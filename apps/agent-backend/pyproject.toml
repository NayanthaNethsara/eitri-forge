[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eitri-agent-backend"
version = "0.0.0"
description = "FastAPI entrypoint for the Eitri Forge agent backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools]
py-modules = ["main"]
