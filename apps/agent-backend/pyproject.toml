[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eitri-agent-backend"
version = "0.0.0"
description = "FastAPI entrypoint for the Eitri Forge agent backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.11,<3",
  "langgraph>=1,<2",
  "langchain-core>=1,<2",
  "langchain-google-genai>=4,<5",
  "pydantic-settings>=2.5,<3",
  "psycopg[binary,pool]>=3.2,<4",
]

[project.scripts]
eitri-agent = "agent.__main__:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["tools*", "agent*", "core*"]

[tool.setuptools.package-data]
"tools.inventory" = ["data/*.json"]
